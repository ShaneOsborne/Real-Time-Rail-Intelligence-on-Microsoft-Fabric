# Run from src/bridge:  docker compose up --build
# Configuration comes from the repo-root .env (copy .env.example to .env first).
services:
  bridge:
    build: .
    image: rail-fabric-rti/bridge:local
    container_name: rail-bridge
    env_file:
      - path: ../../.env
        required: false   # needs Docker Compose v2.24+
    environment:
      # Container-specific values; these override anything with the same name in .env.
      HEALTH_PORT: "8080"
      BRIDGE_OUTPUT_FILE: /app/out/messages.jsonl
      # Interpolated from your shell (scripts/run-local.sh exports it); defaults to console.
      BRIDGE_SINK: ${BRIDGE_SINK:-console}
    ports:
      - "8080:8080"
    volumes:
      - ./out:/app/out
    restart: unless-stopped
    stop_grace_period: 20s

  # Optional RDM Kafka -> Event Hub relay (Lab 05c). Same image, BRIDGE_SOURCE=kafka.
  #   ./scripts/run-local.sh docker eventhub --kafka      (exports .env, then runs this service)
  # Needs RDM_KAFKA_* and EVENTHUB_RDM_CONNECTION_STRING (the rdm-trust send connection string) in .env.
  # Stop it before starting the Azure relay: both would share the RDM consumer group.
  rdm-relay:
    profiles: ["relay"]
    build: .
    image: rail-fabric-rti/bridge:local
    container_name: rail-rdm-relay
    env_file:
      - path: ../../.env
        required: false
    environment:
      BRIDGE_SOURCE: kafka
      BRIDGE_SINK: ${RELAY_SINK:-console}
      # Interpolated from your shell; the relay never falls back to EVENTSTREAM_CONNECTION_STRING.
      EVENTHUB_CONNECTION_STRING: ${EVENTHUB_RDM_CONNECTION_STRING:-}
      HEALTH_PORT: "8080"
    ports:
      - "8082:8080"
    restart: unless-stopped
    stop_grace_period: 20s

  # Offline demo: replays bundled fixtures to the console - no NROD or Fabric account needed.
  #   docker compose --profile offline up --build replay
  replay:
    profiles: ["offline"]
    build: .
    image: rail-fabric-rti/bridge:local
    environment:
      BRIDGE_SOURCE: replay
      BRIDGE_SINK: console
      REPLAY_LOOP: "true"
      REPLAY_INTERVAL_S: "2"
      HEALTH_PORT: "8080"
    ports:
      - "8081:8080"
