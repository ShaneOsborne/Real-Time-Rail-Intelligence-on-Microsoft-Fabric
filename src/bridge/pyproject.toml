[project]
name = "rail-bridge"
version = "0.1.0"
description = "Network Rail Open Data STOMP -> Microsoft Fabric Eventstream bridge"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
