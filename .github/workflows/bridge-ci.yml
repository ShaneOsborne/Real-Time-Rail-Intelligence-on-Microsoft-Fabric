name: bridge-ci

on:
  push:
    branches: [main]
    paths:
      - "src/bridge/**"
      - ".github/workflows/bridge-ci.yml"
  pull_request:
    paths:
      - "src/bridge/**"
      - ".github/workflows/bridge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/bridge/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (no network)
        run: python -m pytest -q
      - name: Offline smoke test (replay -> console)
        run: |
          BRIDGE_SOURCE=replay REPLAY_FILE=tests/fixtures/replay_frames.json REPLAY_INTERVAL_S=0 HEALTH_PORT=0 \
            python -m rail_bridge --sink console | tee out.jsonl
          test "$(wc -l < out.jsonl)" -eq 7

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Container image names must be lowercase, but the GitHub owner can contain capitals
      # (for example ShaneOsborne), so build the image name from a lowercased owner.
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rail-fabric-rti-bridge" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main branch only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: src/bridge
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
