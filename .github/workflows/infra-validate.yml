name: infra-validate

on:
  push:
    branches: [main]
    paths: ["infra/**", "scripts/**", ".github/workflows/infra-validate.yml"]
  pull_request:
    paths: ["infra/**", "scripts/**", ".github/workflows/infra-validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build + lint (no Azure login needed)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning -e SC1091,SC2154 scripts/*.sh   # variables come from .env at runtime
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }; exit 1 }
          }
          Write-Host "PowerShell scripts parsed OK"
