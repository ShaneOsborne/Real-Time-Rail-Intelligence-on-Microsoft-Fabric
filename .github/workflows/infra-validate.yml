name: infra-validate

on:
  push:
    branches: [main]
    paths: ["infra/**", "scripts/**", ".github/workflows/infra-validate.yml"]
  pull_request:
    paths: ["infra/**", "scripts/**", ".github/workflows/infra-validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bicep build + lint (no Azure login needed)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/keyvault.bicep --stdout > /dev/null
          az bicep lint --file infra/keyvault.bicep
          az bicep build --file infra/eventhubs.bicep --stdout > /dev/null
          az bicep lint --file infra/eventhubs.bicep

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        # SC1091: _common.sh is named in a "# shellcheck source=" line but not followed (no -x).
        # SC2154: variables come from .env at runtime, loaded by _common.sh.
        run: shellcheck -S warning -e SC1091,SC2154 scripts/*.sh
      - name: PowerShell parse check
        if: ${{ !cancelled() }}   # run even when ShellCheck fails, so both sets of problems show in one run
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }; exit 1 }
          }
          Write-Host "PowerShell scripts parsed OK"
